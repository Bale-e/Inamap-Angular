<div class="map-body">
  <div class="view-2d" *ngIf="viewMode === '2d'">
    <img src="/assets/2d-models/edificio-a.svg" alt="Edificio A 2D" class="plan-image" />
  </div>

  <div class="view-3d" *ngIf="viewMode === '3d'">
    <div #renderCanvas class="render-canvas"></div>

    <div class="zoom-controls">
      <button class="zoom-btn" (click)="zoomIn()" title="Acercar">+</button>
      <button class="zoom-btn" (click)="zoomOut()" title="Alejar">-</button>
    </div>
  </div>
</div>
