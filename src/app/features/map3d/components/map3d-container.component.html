<div class="map-body">
  <div class="view-2d" *ngIf="viewMode === '2d'">
    <img src="/assets/2d-models/edificio-a.svg" alt="Edificio A 2D" class="plan-image" />
  </div>

  <div class="view-3d" *ngIf="viewMode === '3d'">
    <div #renderCanvas class="render-canvas"></div>

      <div class="floor-action">
      <button class="floor-action__button" type="button" (click)="openFloorDialog()" aria-label="Seleccionar piso">
        <span class="floor-action__ring"></span>
        <span class="floor-action__icon">{{ floorActionIcon }}</span>
      </button>

      <div class="floor-action__dialog" [class.visible]="floorDialogVisible">
        <p>¿A qué piso quieres ir?</p>
        <div class="floor-action__dialog-buttons">
          <button type="button" (click)="selectFloor('first')">Primer piso</button>
          <button type="button" (click)="selectFloor('second')">Segundo piso</button>
        </div>
        <button class="floor-action__dialog-close" type="button" (click)="closeFloorDialog()">Cancelar</button>
      </div>
    </div>

    <div class="zoom-controls">
      <button class="zoom-btn" (click)="zoomIn()" title="Acercar">+</button>
      <button class="zoom-btn" (click)="zoomOut()" title="Alejar">-</button>
    </div>
  </div>
</div>
