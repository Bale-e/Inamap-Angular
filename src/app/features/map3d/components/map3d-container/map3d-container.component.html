<div class="map-control">
  <button class="view-btn" (click)="setView('2d')" [disabled]="viewMode === '2d'">Vista 2D</button>
  <button class="view-btn" (click)="setView('3d')" [disabled]="viewMode === '3d'">Vista 3D</button>
</div>
<div class="map-body">
  <div class="view-2d" *ngIf="viewMode === '2d'">
    <img src="/assets/2d-models/edificio-a.svg" alt="Edificio A 2D" class="plan-image" />
  </div>
  <div class="view-3d" *ngIf="viewMode === '3d'">
    <div #renderCanvas class="render-canvas"></div>
  </div>
</div>
