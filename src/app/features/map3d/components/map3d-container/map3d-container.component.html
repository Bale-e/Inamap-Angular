<div class="map-control">
  <button class="view-btn" (click)="setView('2d')" [disabled]="viewMode === '2d'">Vista 2D</button>
  <button class="view-btn" (click)="setView('3d')" [disabled]="viewMode === '3d'">Vista 3D</button>
</div>

<div class="map-body">
  <div class="view-2d" *ngIf="viewMode === '2d'">
    <img src="/assets/2d-models/edificio-a.svg" alt="Edificio A 2D" class="plan-image" />
  </div>

  <div class="view-3d" *ngIf="viewMode === '3d'">
    <div #renderCanvas class="render-canvas"></div>
    <div class="zoom-controls">
      <button class="zoom-btn" (click)="zoomIn()" title="Acercar">+</button>
      <button class="zoom-btn" (click)="zoomOut()" title="Alejar">-</button>
    </div>
  </div>

  <!-- Fotocopiadora -->
  <div class="marker" id="marker-foto">
    <button class="marker__btn" (click)="toggleMarker('info-foto')">ℹ️</button>
    <div class="marker__card" id="info-foto" style="display:none">
      <p class="marker__nombre">Fotocopiadora y Suministros</p>
      <p class="marker__desc">Servicio de fotocopiado y venta de materiales para estudiantes.</p>
    </div>
  </div>

  <!-- Sala de Tutorias 1 -->
  <div class="marker" id="marker-tuto1">
    <button class="marker__btn" (click)="toggleMarker('info-tuto1')">ℹ️</button>
    <div class="marker__card" id="info-tuto1" style="display:none">
      <p class="marker__nombre">Sala de Tutorías 1</p>
      <p class="marker__desc">Espacio de apoyo académico con tutores disponibles.</p>
    </div>
  </div>

  <!-- Sala de Tutorias 2 -->
  <div class="marker" id="marker-tuto2">
    <button class="marker__btn" (click)="toggleMarker('info-tuto2')">ℹ️</button>
    <div class="marker__card" id="info-tuto2" style="display:none">
      <p class="marker__nombre">Sala de Tutorías 2</p>
      <p class="marker__desc">Espacio de apoyo académico con tutores disponibles.</p>
    </div>
  </div>

</div>
